build:
command: "pip install -r requirements.txt"
system: railpack
min_cpu: 0.1
max_cpu: 0.5
min_memory: 256
max_memory: 2048

working_directory: /
build_context_directory: ""
pre_build_command: ""
post_build_command: ""

start_command: "uvicorn MaceHost --host 0.0.0.0 --port $PORT"

scaling:
min_cpu: 0.01
max_cpu: 0.1
min_memory: 256
max_memory: 512
min_replicas: 1
max_replicas: 1

health_check:
type: tcp
interval_in_seconds: 10

cron_jobs: []
workers: []

review_apps:
enabled: false
ttl_days: 7
